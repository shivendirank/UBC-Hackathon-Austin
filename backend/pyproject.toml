[project]
name = "thin-ice"
version = "0.1.0"
description = "Live A-F reliability grades for Gemini prediction markets, with onchain receipts on Solana"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=13",
    "python-dotenv>=1.0",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
chain = ["solders>=0.21"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["thin_ice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
