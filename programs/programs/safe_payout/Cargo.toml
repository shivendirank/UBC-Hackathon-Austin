[package]
name = "safe_payout"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "safe_payout"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "odds_receipt/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
odds_receipt = { path = "../odds_receipt", features = ["cpi"] }
